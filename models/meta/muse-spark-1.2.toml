# Sources:
# https://research.meta.ai/blog/introducing-muse-code-and-muse-spark-1-2
# https://dev.meta.ai/docs/overview/ (standard: muse-spark-1.2; contributor: muse-spark-1.2-contributor)
# https://dev.meta.ai/docs/features/reasoning (effort: minimal|low|medium|high|xhigh; none unsupported)
# https://openrouter.ai/meta/muse-spark-1.2
# https://openrouter.ai/api/v1/models/meta/muse-spark-1.2/endpoints
name = "Muse Spark 1.2"
description = "Coding-focused update to Muse Spark 1.1 for agentic software engineering: code generation, debugging, codebase understanding, and multi-agent workflows. Natively multimodal reasoning model with a 1M-token context window."
family = "muse"
release_date = "2026-08-05"
last_updated = "2026-08-05"
attachment = true
reasoning = true
temperature = true
tool_call = true
structured_output = true
open_weights = false

[limit]
context = 1_048_576
output = 1_048_576

[modalities]
input = ["text", "image", "video", "audio", "pdf"]
output = ["text"]
