# Sources:
# - https://docs.z.ai/devpack/using5.1 (contextWindow: 204800 for glm-5.1 / glm-5 / glm-4.7)
# - https://docs.z.ai/guides/overview/concept-param (max_tokens binary: 131072)
# - https://docs.z.ai/guides/llm/glm-5.1 (documented 200K context / 128K output)
name = "GLM-5.1"
description = "Strong GLM coding model for agentic engineering, terminals, and repository generation"
family = "glm"
release_date = "2026-04-07"
last_updated = "2026-04-07"
attachment = false
reasoning = true
temperature = true
tool_call = true
structured_output = true
open_weights = true

[limit]
context = 204_800
output = 131_072

[modalities]
input = ["text"]
output = ["text"]

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/zai-org/GLM-5.1"

[[benchmarks]]
name = "Artificial Analysis Coding Agent Index"
score = 52.7
metric = "average pass@1"
harness = "Claude Code"
source = "https://artificialanalysis.ai/agents/coding-agents"

[[benchmarks]]
name = "SWE-Atlas Codebase QnA"
score = 73.2
metric = "pass@1"
harness = "Claude Code"
source = "https://artificialanalysis.ai/agents/coding-agents"

[[benchmarks]]
name = "SWE-Bench Pro"
score = 19.8
metric = "pass@1"
harness = "Claude Code"
dataset = "hard-aa"
source = "https://artificialanalysis.ai/agents/coding-agents"

[[benchmarks]]
name = "Terminal-Bench"
score = 65.1
metric = "pass@1"
harness = "Claude Code"
version = "2.1"
source = "https://artificialanalysis.ai/agents/coding-agents"
