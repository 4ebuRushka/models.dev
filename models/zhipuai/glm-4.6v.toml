# Sources:
# - https://docs.z.ai/guides/vlm/glm-4.6v (documented 128K context)
# - https://docs.z.ai/guides/overview/concept-param (max_tokens binary: 32768 for glm-4.6v)
# - https://docs.z.ai/devpack/using5.1 (binary K convention: 204800 for 200K; same radix for 128K → 131072)
# - Sibling glm-4.5 series already uses context = 131_072 for documented 128K
name = "GLM-4.6V"
description = "GLM vision model for visual reasoning, documents, and multimodal agents"
family = "glm"
release_date = "2025-12-08"
last_updated = "2025-12-08"
attachment = true
reasoning = true
temperature = true
tool_call = true
knowledge = "2025-04"
open_weights = true

[limit]
context = 131_072
output = 32_768

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/zai-org/GLM-4.6V"
