# Source: https://routellm.abacus.ai/v1/models
base_model = "openai/gpt-5.4"
base_model_omit = ["limit.input"]
reasoning = true
reasoning_options = []

[cost]
input = 2.5
output = 15
cache_read = 0.25

[limit]
context = 400_000
output = 128_000

[modalities]
input = ["text", "image"]
output = ["text"]
