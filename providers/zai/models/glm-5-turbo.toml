# Sources:
# - https://docs.z.ai/devpack/using5.1 (contextWindow: 204800 for Z.AI 200K GLM models)
# - https://docs.z.ai/guides/overview/concept-param (max_tokens binary: 131072 for glm-5-turbo)
name = "GLM-5-Turbo"
description = "Faster GLM-5 lane for coding agents that need lower latency"
family = "glm"
release_date = "2026-03-16"
last_updated = "2026-03-16"
attachment = false
reasoning = true
temperature = true
tool_call = true
structured_output = true
open_weights = false

[[reasoning_options]]
type = "toggle"

[interleaved]
field = "reasoning_content"

[cost]
input = 1.20
output = 4.00
cache_read = 0.24
cache_write = 0

[limit]
context = 204800
output = 131072

[modalities]
input = ["text"]
output = ["text"]
