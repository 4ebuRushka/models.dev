# Subconscious serves TIM-Qwen3.6 27B as subconscious/tim-qwen3.6-27b.
# Pricing (USD per 1M tokens): cached $0.15, input $0.30, output $3.00.
# Reasoning controls: the OpenAI-compatible format toggles thinking via
# chat_template_kwargs.enable_thinking (true|false); the Anthropic Messages
# format uses thinking.type = "enabled" with thinking.budget_tokens to cap
# reasoning. For the OpenAI-compatible endpoint, reasoning streams inline
# within the content field (between think tags).
# Sources (accessed 2026-07-06):
#   https://www.subconscious.dev/pricing
#   https://docs.subconscious.dev/features/thinking
name = "TIM-Qwen3.6 27B"
description = "Reasoning model for deliberate analysis, multi-step problem solving, and tool use"
attachment = false
reasoning = true
tool_call = true
structured_output = true
temperature = true
release_date = "2026-05-11"
last_updated = "2026-05-11"
open_weights = false
interleaved = true

[[reasoning_options]]
type = "toggle" # API: {"chat_template_kwargs": {"enable_thinking": true | false}}

[[reasoning_options]]
type = "budget_tokens" # API: {"thinking": {"type": "enabled", "budget_tokens": <n>}}

[cost]
input = 0.3
output = 3.0
cache_read = 0.15

[limit]
context = 8192
input = 8192
output = 5000

[modalities]
input = ["text"]
output = ["text"]
