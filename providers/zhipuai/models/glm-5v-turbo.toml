# Sources:
# - https://docs.z.ai/devpack/using5.1 (contextWindow: 204800 for Z.AI 200K GLM models)
# - https://docs.z.ai/guides/overview/concept-param (max_tokens binary: 131072 for glm-5v-turbo)
name = "GLM-5V-Turbo"
description = "Fast GLM vision model for screenshots, documents, and multimodal agent tasks"
family = "glm"
release_date = "2026-04-01"
last_updated = "2026-04-01"
attachment = true
reasoning = true
temperature = true
tool_call = true
open_weights = false

[[reasoning_options]]
type = "toggle"

[interleaved]
field = "reasoning_content"

[cost]
input = 5.00
output = 22.00
cache_read = 1.20
cache_write = 0

[limit]
context = 204800
output = 131072

[modalities]
input = ["text", "image", "video", "pdf"]
output = ["text"]
